<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Respawn After Bedtime – en gamingcommunity för vuxna 30+. Hitta spelkompisar, speltips och gemenskap."
    />
    <title>Hem | Respawn After Bedtime</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <!-- Webbplatsens logotyp -->
      <a
        href="index.html"
        class="logo"
        aria-label="Respawn After Bedtime – startsida"
      >
        <img src="images/logo.png" alt="Respawn After Bedtime" />
      </a>

      <!-- Knapp för mobilnavigation -->
      <button
        class="menu-toggle"
        type="button"
        aria-label="Öppna menyn"
        aria-expanded="false"
        aria-controls="main-nav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Huvudnavigation -->
      <nav id="main-nav" aria-label="Huvudnavigation">
        <ul>
          <li><a href="index.html" aria-current="page">Hem</a></li>
          <li><a href="spel.html">Spel</a></li>
          <li><a href="community.html">Community</a></li>
          <li><a href="bli-medlem.html">Bli medlem</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>

      <!-- Funktioner till höger i desktopmenyn -->
      <div class="header-actions">
        <button class="search-button" type="button" aria-label="Sök">
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
        </button>

        <a href="https://discord.com/" class="discord-button hero-button">
          Discord
        </a>
      </div>
    </header>

    <main>
      <!-- Hero-sektion: presenterar vår gamingcommunity -->
      <section class="hero">
        <!-- Bilden visas över texten på mobil -->
        <div class="hero-image">
          <img
            src="images/hero.png"
            alt="En vuxen gamer vid en dator i ett rum med neonbelysning"
          />
        </div>

        <!-- Hero-sektionens textinnehåll -->
        <div class="hero-content">
          <p class="hero-label">EN GAMINGCOMMUNITY FÖR VUXNA 30+</p>

          <h1>
            KIDS ASLEEP.<br />
            <span>GAME ON.</span>
          </h1>

          <p class="hero-description">
            För dig som älskar spel, men också har ett liv utanför skärmen.
            Hitta gemenskap, speltips och diskussioner med andra vuxna gamers.
          </p>

          <!-- Knappar med samma grundutseende -->
          <div class="hero-buttons">
            <a href="https://discord.com/" class="hero-button">
              Gå med på Discord
            </a>

            <a href="spel.html" class="hero-button"> Utforska spel </a>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
